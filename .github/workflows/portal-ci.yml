name: Portal CI

# The "robot inspector" for the BAM portal. Runs automatically on every PR that
# touches the portal and shows a ✅/❌ on the PR. It is NOT a required check yet —
# it's advisory while Zoran watches it work. To make it block merges later, turn on
# "Require status checks to pass" for `main` in GitHub branch protection and select
# the "Build + checks" job. See bam-ghl-agent/docs/portal-engineering-guide.md.

on:
  pull_request:
    paths:
      - "bam-ghl-agent/bam-portal/**"
      - ".github/workflows/portal-ci.yml"
      # The GTA byte-for-byte locks and the approval-render suite read their
      # fixtures from scripts/snapshots/ at the MONOREPO ROOT, which is outside the
      # filter above. So a PR editing only a snapshot did not run the very suites
      # whose entire job is to notice when a snapshot and production disagree - the
      # one change most able to break them was the one change that skipped them.
      - "scripts/snapshots/**"
  push:
    branches: [main]
    paths:
      - "bam-ghl-agent/bam-portal/**"
      - ".github/workflows/portal-ci.yml"
      # The GTA byte-for-byte locks and the approval-render suite read their
      # fixtures from scripts/snapshots/ at the MONOREPO ROOT, which is outside the
      # filter above. So a PR editing only a snapshot did not run the very suites
      # whose entire job is to notice when a snapshot and production disagree - the
      # one change most able to break them was the one change that skipped them.
      - "scripts/snapshots/**"

# Cancel an in-progress run if the same PR/branch gets a new push.
concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build + checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bam-ghl-agent/bam-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bam-ghl-agent/bam-portal/package-lock.json

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Build the staff portal
        run: npm run build

      - name: Syntax-check every API function
        run: |
          fail=0
          for f in $(find api -name '*.js'); do
            if ! node --check "$f"; then
              echo "::error file=bam-ghl-agent/bam-portal/$f::JavaScript syntax error"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more API functions have a syntax error."
            exit 1
          fi
          echo "All API functions parse OK."

      # ONE eslint rule - no-undef - and deliberately only that one.
      #
      # WHY THIS STEP EXISTS. `api/automations.js` shipped `const client`
      # declared inside a try and read from the catch. const is block-scoped, so
      # every retryable send failure threw ReferenceError from INSIDE the error
      # handler; that crashed the cron run, and because the crash skipped the
      # attempts counter, the 15-minute stale-claim reaper re-queued the same job
      # forever - a send that could never fail out and could never stop. The step
      # ABOVE cannot see this: `node --check` parses that file happily, because
      # scope errors are not syntax errors. eslint flagged the exact line.
      #
      # It shipped anyway. api/*.js was being linted with BROWSER globals, so
      # `process` and `Buffer` produced 1223 no-undef errors that were not bugs,
      # and a linter that cries wolf 1223 times is one nobody runs. The cure was
      # the api/ block in eslint.config.js (declare the right environment), NOT a
      # mass edit of live payment and messaging code. Exactly 4 real errors were
      # hiding underneath, every one of them a live crash.
      #
      # WHY NOT MORE RULES. api/ still carries 943 no-unused-vars / no-empty /
      # no-useless-escape errors. Gating on those means CI is red the day it
      # lands, and a gate that
      # blocks merges for style gets switched off by whoever needs to ship - and
      # then there is nothing again. no-undef is different in kind: it cannot
      # fire on working code. Every hit is a name that does not exist at runtime.
      # DO NOT widen this step. If you want the rest, add a separate advisory one.
      #
      # The script self-tests before it trusts a clean run: it lints a name that
      # is definitely undefined and requires no-undef back, so a config drift that
      # silently stops checking api/ fails loudly instead of passing green. The
      # MUTATE=probe control below proves that self-test is not decorative, under
      # the same rule as every other control here - it counts as caught ONLY if
      # the run SAYS "NEGATIVE CONTROL PASSED".
      - name: Lint gate - no-undef on api/
        run: |
          npm run lint:api-no-undef
          out=$(MUTATE=probe npm run --silent lint:api-no-undef 2>&1) || true
          if printf '%s' "$out" | grep -q 'NEGATIVE CONTROL PASSED'; then
            echo "  caught   lint-api-no-undef MUTATE=probe"
          else
            echo "::error file=bam-ghl-agent/bam-portal/scripts/lint-api-no-undef.mjs::MUTATE=probe did not report NEGATIVE CONTROL PASSED - the gate's self-test no longer proves the rule fires"
            exit 1
          fi

      # Every committed plain-node suite, discovered by GLOB rather than a list.
      #
      # WHY A GLOB. Before 2026-07-29 this workflow ran none of them. Seven suites
      # were committed, trusted and quoted as evidence - the GTA byte-for-byte
      # locks, the sync_class leak gate, the Blueprint data-loss guards, the fee
      # reconciliation - and every one of them only ever ran when a human chose to
      # type the command. A suite nobody runs is a comment that took longer to
      # write. A hardcoded list would have rotted the same way, one forgotten line
      # at a time, so a new api/_*.test.mjs is covered the moment it is committed.
      #
      # These run on plain node: no dependencies, no network, no database. If one
      # ever needs any of those, it does not belong in this step.
      - name: Run the API test suites
        run: |
          fail=0
          for t in api/_*.test.mjs; do
            echo "── $t"
            if ! node "$t"; then
              echo "::error file=bam-ghl-agent/bam-portal/$t::suite failed"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "One or more API suites failed."; exit 1; }
          echo "All API suites passed."

      # The negative controls, which are what make the suites above mean anything.
      # A suite that only ever passes proves nothing about whether it would notice
      # a regression, so each control deliberately breaks one thing and the suite
      # must NOTICE. Controls are discovered from each file's own MUTATE= docs.
      #
      # "Caught" REQUIRES the suite to print NEGATIVE CONTROL PASSED. A non-zero
      # exit is deliberately NOT accepted as proof, and that is a fix rather than
      # pedantry: every suite here prints the banner, and when a mutation matches
      # nothing the suite ALSO exits non-zero (it prints NEGATIVE CONTROL FAILED
      # and fails on purpose). So "rc != 0 means caught" reported a control that no
      # longer existed as working - delete a control from the code, leave its
      # MUTATE= line in the docs, and this step went green. Found 2026-07-29 by
      # hitting the identical false positive in a hand-written verification loop.
      #
      # The failure being hunted is a control that changes nothing the suite
      # notices, because then the confidence it buys is fake.
      - name: Run the negative controls
        run: |
          fail=0
          for t in api/_*.test.mjs; do
            controls=$(grep -ohE 'MUTATE=[A-Za-z][A-Za-z0-9_-]*' "$t" | sed 's/MUTATE=//' | sort -u)
            [ -n "$controls" ] || continue
            # A BROKEN suite fails under every mutation, so every one of its
            # controls would look "caught" for the wrong reason. Require a clean
            # run first, or the controls prove nothing about the controls.
            if ! node "$t" >/dev/null 2>&1; then
              echo "::error file=bam-ghl-agent/bam-portal/$t::suite is not green, so its negative controls cannot be judged"
              fail=1
              continue
            fi
            for m in $controls; do
              out=$(MUTATE="$m" node "$t" 2>&1) || true
              if printf '%s' "$out" | grep -q 'NEGATIVE CONTROL PASSED'; then
                echo "  caught   $t MUTATE=$m"
              else
                echo "::error file=bam-ghl-agent/bam-portal/$t::negative control MUTATE=$m did not report NEGATIVE CONTROL PASSED - it changed nothing the suite noticed, or it no longer exists in the code and only its MUTATE= doc line remains"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || { echo "A negative control is decorative."; exit 1; }

      - name: Verify client-portal onboarding tour targets
        working-directory: bam-ghl-agent
        run: node bam-portal/scripts/verify-client-portal-ui.mjs

      # Business Blueprint hydration guards. Separate from the suites above because
      # it lives in scripts/ and runs from the parent directory.
      #
      # This script carries FOUR controls, each reverting a different hydration fix,
      # and CI ran only b1 - so b2, b3 and b4 were committed, documented and never
      # executed, the same "trusted because it exists" gap the suites step above was
      # rewritten to close. All four bite; nobody had checked.
      #
      # Controls are read from the script's own MUT map, which is the source of
      # truth. Do NOT go back to grepping the prose docs: they said "b1|b2|b3|b4" in
      # one line and "b1|b2|b3" in another, and a MUTATE= glob found only b1, which
      # is how a loop that looked like it covered everything covered one quarter.
      #
      # The script now prints the same NEGATIVE CONTROL PASSED banner as the api
      # suites, so this step applies the identical rule: a control counts as caught
      # only when the run SAYS so. Exit status cannot carry it - an unknown control
      # name and a control whose target text has moved both exit non-zero too.
      - name: Verify Business Blueprint hydration guards
        working-directory: bam-ghl-agent
        run: |
          node bam-portal/scripts/verify-bb-hydration.mjs
          controls=$(sed -n '/^const MUT = {/,/^};/p' bam-portal/scripts/verify-bb-hydration.mjs \
                     | grep -oE '^  [A-Za-z][A-Za-z0-9_]*:' | tr -d ' :')
          [ -n "$controls" ] || { echo "::error::could not read the MUT control map - re-point this step at it"; exit 1; }
          fail=0
          for m in $controls; do
            out=$(MUTATE="$m" node bam-portal/scripts/verify-bb-hydration.mjs 2>&1) || true
            if printf '%s' "$out" | grep -q 'NEGATIVE CONTROL PASSED'; then
              echo "  caught   MUTATE=$m"
            else
              echo "::error::verify-bb-hydration MUTATE=$m did not report NEGATIVE CONTROL PASSED - it is decorative, missing, or its target text has moved"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Hydration guards pass and every one of their negative controls bites."

      # No testimonial content may ship hardcoded from source - it must reach
      # output through the resolver (api/_testimonials.js). Here this scans the
      # portal's email templates + agent defaults for the fabricated-reviewer
      # corpus; the bam-client-sites half of the same check runs in that repo.
      # Without Supabase secrets the run is DEGRADED (store-quote half skipped)
      # and says so in its output rather than passing silently.
      - name: No hardcoded testimonials in email templates or agent defaults
        run: node scripts/check-testimonial-hardcodes.mjs /nonexistent-no-sites-checkout-in-ci

      # nurture-3 (and the member email derived from it) must render each
      # academy's OWN quotes from the store, and must render NOTHING when the
      # store is empty. Renders the real template through the real renderEmail;
      # no database needed, rows are injected.
      - name: nurture-3 renders from the testimonials store
        run: node scripts/verify-nurture3-from-store.mjs
